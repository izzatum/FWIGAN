name: Search documentation

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/*search_site.py'
      - 'README.md'
      - 'CITATION.cff'
      - 'codemeta.json'
      - 'docs/assets/marmousi-120epoch-velocity-models.png'
      - 'docs/validation/marmousi-120epoch/*-metrics.json'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'scripts/*search_site.py'
      - 'README.md'
      - 'CITATION.cff'
      - 'codemeta.json'
      - 'docs/assets/marmousi-120epoch-velocity-models.png'
      - 'docs/validation/marmousi-120epoch/*-metrics.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: search-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - name: Build static documentation without scientific dependencies
        run: python scripts/build_search_site.py
      - name: Check indexing metadata, links and source evidence
        run: python scripts/check_search_site.py _site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy verified documentation
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
