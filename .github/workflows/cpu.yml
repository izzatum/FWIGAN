name: Bounded CPU checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-22.04
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      MAX_JOBS: '2'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install setuptools==69.5.1 wheel==0.45.1
      - run: python -m pip install torch==1.13.1+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==1.23.5 scipy==1.10.1
      - run: python -m pip install --no-build-isolation deepwave==0.0.9
      - run: python -m pip install -e '.[test,plot]'
      - run: python -m pytest -q
