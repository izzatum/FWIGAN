# Bounded CPU synthetic example. All coordinates are physical metres.
experiment:
  method: fwigan
  device: cpu
  seed: 42
  epochs: 2
  batches: 2
  batch_size: 2
  critic_cycles: 6
  amp: false
  noise: true
  sigma_init: 0.08
  evaluation_interval: 1
  checkpoint_interval: 2
dataset:
  kind: tiny
  nt: 128
  shots: 2
  receivers: 60
