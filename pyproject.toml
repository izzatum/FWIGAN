[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fwigan"
version = "0.1.0"
description = "Reproducible full waveform inversion research toolkit"
requires-python = ">=3.10,<3.11"
dependencies = ["torch==1.13.1", "deepwave==0.0.9", "numpy==1.23.5", "scipy==1.10.1"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
