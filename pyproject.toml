[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fwigan"
version = "0.1.0"
description = "Reproducible full waveform inversion research toolkit"
requires-python = ">=3.10,<3.11"
dependencies = ["torch==1.13.1", "deepwave==0.0.9", "numpy==1.23.5", "scipy==1.10.1", "PyYAML==6.0.2"]

[project.optional-dependencies]
test = ["pytest>=7"]
plot = ["matplotlib==3.7.5"]
notebook = ["matplotlib==3.7.5", "nbformat>=5,<6", "nbclient>=0.10,<0.11", "ipykernel>=6,<7"]

[project.scripts]
fwigan = "fwigan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
